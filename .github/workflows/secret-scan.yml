name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

# Uses the gitleaks binary via its official Docker image rather than the
# gitleaks-action wrapper: the Action requires a paid license for organization
# accounts, but the binary itself is free/open-source. GitHub's native secret
# scanning + push protection (enabled in repo settings) is the primary defense;
# this is belt-and-suspenders that also runs on PRs.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 dir /repo --redact --exit-code 1
